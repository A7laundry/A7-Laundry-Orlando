  created: "2026-07-02"
  status: "ARCHIVED — substituído pela campanha manual Guest Laundry; não implantar"
  rationale: "Whitespace tourist/Airbnb no Meta. Reforça/pode isolar o público turista (hoje = AS2 da JUL26)."
