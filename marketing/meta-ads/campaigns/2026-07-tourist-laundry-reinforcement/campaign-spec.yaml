  - concept: "tourist-pack-less"
    ad_set: "TOURIST"
    hook: "Pack less. We wash the rest."
    formats: ["1:1", "4:5", "9:16"]
    status: "PENDING"
  - concept: "tourist-express-checkout"
    ad_set: "EXPRESS"
    hook: "Dirty clothes before checkout?"
    formats: ["1:1", "4:5", "9:16"]
    status: "PENDING"
  manifest_ref: "MANIFEST.md"

