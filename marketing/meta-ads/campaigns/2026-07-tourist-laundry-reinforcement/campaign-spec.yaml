campaign:
  name: "A7 | Tourist Laundry + Express | Corridor | JUL26"
  objective: "OUTCOME_ENGAGEMENT"          # Click-to-WhatsApp inicialmente
  buying_type: "AUCTION"
  budget:
    type: "CBO"
    daily_budget_usd: 15.00                 # sugestão; confirmar antes de build
  special_ad_categories: []
  deploy_policy: "born PAUSED; publish = gate manual separado"

destination:
  type: "WHATSAPP"
  page_id: "625129510685107"
  whatsapp: "+1 407-670-8839"

ad_sets:
  - ref: "audiences.yaml#TOURIST"
    prefilled_message: "Hi A7! I'm at a hotel/Airbnb in Orlando & need laundry pickup. My location is:"
    offer:
      price: "From $3.25/lb"
      minimum: "$50"
      includes: "Pickup & delivery included · Hotel & Airbnb pickup"
    ad_concepts: ["tourist-laundry-parks", "tourist-pack-less"]

  - ref: "audiences.yaml#EXPRESS"
    prefilled_message: "Hi A7! Need same-day laundry pickup at my Orlando hotel/Airbnb. My location is:"
    offer:
      price: "From $3.95/lb"
      minimum: "$50"
      note: "Subject to availability · Ask for today's availability (NUNCA 'guaranteed')"
    ad_concepts: ["tourist-express-checkout"]

# Pipeline de criativos: 3 conceitos × 3 formatos = 9 slots. Detalhe em MANIFEST.md + creatives-map.csv.
