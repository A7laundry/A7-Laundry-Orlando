<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>A7 MOS — Acesso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#05080f;color:#f8fafc;font-family:Inter,system-ui,sans-serif;background-image:linear-gradient(rgba(37,99,235,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.04) 1px,transparent 1px);background-size:48px 48px}.shell{width:min(100%,440px)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.brand img{width:44px;height:44px;object-fit:contain}.brand strong{font-size:16px}.brand span{display:block;color:#64748b;font-size:12px;margin-top:2px}.card{padding:36px;border:1px solid rgba(255,255,255,.08);border-radius:20px;background:rgba(12,18,32,.96);box-shadow:0 30px 80px rgba(0,0,0,.35)}h1{margin:0;font-size:30px;letter-spacing:-1px}p{color:#94a3b8;font-size:14px;line-height:1.6;margin:10px 0 28px}label{display:block;font-size:12px;font-weight:700;color:#cbd5e1;margin:16px 0 7px}input{width:100%;height:48px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#111b2e;color:#f8fafc;padding:0 14px;font:inherit;outline:none}input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(37,99,235,.16)}button{width:100%;height:50px;border:0;border-radius:10px;background:#2563eb;color:white;font:700 14px Inter;margin-top:22px;cursor:pointer}button:hover{background:#1d4ed8}button:disabled{opacity:.65;cursor:wait}.error{min-height:20px;color:#fca5a5;font-size:12px;margin-top:14px}.security{font-size:11px;color:#64748b;text-align:center;margin-top:20px}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><img src="/logo-a7-laundry-usa.png" alt="A7 Laundry"><div><strong>A7 Laundry MOS</strong><span>Sistema de Gestão Operacional</span></div></div>
    <section class="card">
      <h1>Acesso interno</h1>
      <p>Entre com a conta autorizada para consultar os indicadores operacionais da A7 Laundry Orlando.</p>
      <form id="loginForm">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus>
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="12">
        <button id="submitButton" type="submit">Entrar no MOS</button>
        <div id="error" class="error" role="alert" aria-live="polite"></div>
      </form>
    </section>
    <div class="security">Sessão protegida · Acesso restrito · Dados não públicos</div>
  </main>
  <script>
    var form=document.getElementById('loginForm');
    form.addEventListener('submit',async function(event){
      event.preventDefault();
      var button=document.getElementById('submitButton');
      var error=document.getElementById('error');
      button.disabled=true;button.textContent='Validando…';error.textContent='';
      try{
        var response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.email.value,password:form.password.value})});
        var result=await response.json();
        if(!response.ok)throw new Error(result.error||'Não foi possível entrar.');
        var target=new URLSearchParams(location.search).get('returnTo');
        location.href=target&&target.startsWith('/')&&!target.startsWith('//')?target:'/';
      }catch(reason){error.textContent=reason.message||'Não foi possível entrar.';button.disabled=false;button.textContent='Entrar no MOS'}
    });
  </script>
</body>
</html>
